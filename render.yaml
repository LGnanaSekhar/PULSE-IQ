services:
  - type: web
    name: pulseiq
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_SECRET
        generateValue: true
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_COLLEGE_NAME
        sync: false
      - key: BOOTSTRAP_COLLEGE_DOMAIN
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: SEED_DEMO
        value: "false"
      - key: IMPORT_LEGACY_V2
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
